# 测试环境配置

# 基础配置
base_url: "https://t-erp-portal-test.app.terminus.io"
iam_url: "https://t-erp-iam-test.app.terminus.io"
api_version: "v1"

# 认证配置
auth:
  username: "17376596912"
  password: "Anson2454@"
  token_expiry: 3600  # token过期时间（秒）
  retry_attempts: 3   # 重试次数

# 数据库配置
database:
  erp_db:
    host: "rm-bp1f14585v00oh99t.mysql.rds.aliyuncs.com"
    port: 3306
    user: "terp_test"
    password: "43sVPCQ2pE%g55bc"
    name: "terp_test"


# 日志配置
logging:
  path: "logs"
  level: "INFO"
  format: "json"
  rotation: "daily"
  retention: "7 days"
  log_dir: "logs"

# 超时配置
timeouts:
  api_request: 30  # API请求超时时间（秒）
  page_load: 60    # 页面加载超时时间（秒）
  element_wait: 10 # 元素等待超时时间（秒）

# 测试数据配置
test_data:
  default_language: "zh_CN"
  default_currency: "CNY"
  default_timezone: "Asia/Shanghai"

# 安全配置
security:
  ssl_verify: true
  allowed_origins:
    - "https://t-erp-portal-test.app.terminus.io"
    - "https://t-erp-portal-test.app.terminus.io:443"

# 报告配置
reporting:
  allure:
    report_dir: "reports/allure"
    results_dir: "reports/allure-results"
  html:
    report_dir: "reports/html"
  junit:
    report_dir: "reports/junit"

# 性能监控配置
performance:
  monitor_interval: 5  # 监控间隔（秒）
  metrics:
    - cpu_usage
    - memory_usage
    - disk_usage
    - network_io
  thresholds:
    cpu_usage: 80
    memory_usage: 80
    disk_usage: 80 