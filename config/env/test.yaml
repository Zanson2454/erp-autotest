# 测试环境多用户配置示例
erp_env: "test"
erp_version: "0830"
trantor_version: "3.0.2509"

# 多门户认证信息配置
portal_config:
  terp: # 租户级别
    # 默认用户配置（向后兼容）
    auth:
      username: "${TEST_USERNAME}"
      password: "${TEST_PASSWORD}"
    
    
    # 多门户配置（新增）
    TERP_PORTAL: # 门户 key
      username: "${TEST_TERP_PORTAL_USERNAME}"
      password: "${TEST_TERP_PORTAL_PASSWORD}"
      iam_url: "${TEST_TERP_PORTAL_IAM_URL}"
      iam_referer: "${TEST_TERP_PORTAL_IAM_REFERER}"
      portal_url: "${TEST_TERP_PORTAL_URL}"
      portal_referer: "${TEST_TERP_PORTAL_REFERER}"
      description: "TERP门户"
      
    
    TERP_CUST_PC: # 门户 key
      username: "${TEST_TERP_CUST_PC_USERNAME}"
      password: "${TEST_TERP_CUST_PC_PASSWORD}"
      iam_url: "${TEST_TERP_CUST_PC_IAM_URL}"
      iam_referer: "${TEST_TERP_CUST_PC_IAM_REFERER}"
      portal_url: "${TEST_TERP_CUST_PC_URL}"
      portal_referer: "${TEST_TERP_CUST_PC_REFERER}"
      description: "TERP客户端PC门户"
        
    

# 数据库配置
database:
  erp_db:
    host: ${TEST_DB_HOST}
    port: ${TEST_DB_PORT}
    user: ${TEST_DB_USER}
    password: ${TEST_DB_PASSWORD}
    database: ${TEST_DB_NAME}
    charset: utf8mb4
  iam_db:
    host: ${TEST_DB_HOST}
    port: ${TEST_DB_PORT}
    user: ${TEST_DB_USER}
    password: ${TEST_DB_PASSWORD}
    database: ${TEST_IAM_DB_NAME}
    charset: utf8mb4
