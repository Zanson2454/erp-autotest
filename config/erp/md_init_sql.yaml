# =============================================================================
# ERP自动化测试 - 主数据配置查询定义
# =============================================================================
#
# 文件信息:
#   名称: md_init_sql.yaml
#   模块: 主数据配置 (MD - Master Data)
#   版本: 1.0.0
#   作者: ERP测试团队
#   更新日期: 2025-01-15
#   描述: 定义主数据相关的基础配置SQL查询，用于ERP系统自动化测试的组织、物料、合作伙伴等主数据初始化
#
# 使用说明:
#   1. 所有SQL查询必须包含 deleted=0 条件（软删除过滤）
#   2. 组织相关查询使用 org_code LIKE 'AUTOTEST%' 条件，确保查询测试数据
#   3. 物料相关查询使用 mat_code LIKE 'AUTOTEST_%' 条件，确保查询测试数据
#   4. 合作伙伴查询使用固定 code='AUTOTEST_*' 条件，确保查询测试数据
#   5. validation 字段定义数据验证规则，确保数据质量和业务正确性
#
# 更新历史:
#   v1.0.0 (2025-01-15): 初始版本，标准化注释和格式
#
# =============================================================================

org_info:
  # ===========================================================================
  # 组织基础配置组 - 组织架构的核心配置数据
  # ===========================================================================

  # ---------------------------
  # 组织业务类型配置 - 组织分类基础数据
  # ---------------------------
  org_biz_type_cf:
    sql: |
      SELECT
        id,                      -- 主键ID
        `code`,                  -- 业务类型代码
        `name`                   -- 业务类型名称
      FROM org_business_type_cf
      WHERE deleted = 0          -- 技术条件: 软删除过滤
      ORDER BY id;               -- 排序: 确保结果稳定

    description: "查询所有有效的组织业务类型信息，用于组织分类和权限控制"

    validation:
      required: false                   # 可选配置，组织管理时必需
      min_records: 1                    # 最少1条记录（通常有多种业务类型）
      required_fields: ["id", "code", "name"]
      business_rules:
        - "组织业务类型用于组织架构设计，必须确保数据完整性"

  # ---------------------------
  # 组织属性配置 - 组织扩展属性定义
  # ---------------------------
  org_attr_cf:
    sql: |
      SELECT
        id,                      -- 主键ID
        attr_field,              -- 属性字段名
        attr_code,               -- 属性代码
        attr_name                -- 属性名称
      FROM gen_attr_cf
      WHERE attr_class_code = 'ORG'  -- 业务条件: 组织类属性
        AND status = 'ENABLED'       -- 业务条件: 只查询启用状态
        AND deleted = 0              -- 技术条件: 软删除过滤
      ORDER BY attr_code;            -- 排序: 按代码排序

    description: "查询组织类的扩展属性定义，用于组织信息的扩展配置"

    validation:
      required: false                   # 可选配置，组织属性扩展时必需
      min_records: 0                    # 可为空（可能没有扩展属性）
      required_fields: ["id", "attr_field", "attr_code", "attr_name"]
      business_rules:
        - "组织属性用于扩展组织信息，必须与组织结构表关联使用"

  # ---------------------------
  # 组织身份配置 - 组织身份类型定义
  # ---------------------------
  org_identity_cf:
    sql: |
      SELECT
        id,                      -- 主键ID
        `code`,                  -- 身份代码
        `name`                   -- 身份名称
      FROM org_identity_cf
      WHERE code = 'EMP'         -- 业务条件: 固定查询员工身份
        AND status = 'ENABLED'   -- 业务条件: 只查询启用状态
        AND deleted = 0          -- 技术条件: 软删除过滤
      LIMIT 1;                   -- 性能优化: 只获取一条记录

    description: "查询员工身份类型信息，用于组织身份验证和权限分配"

    validation:
      required: false                   # 可选配置，员工管理时必需
      min_records: 0                    # 可为空
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "code", "name"]
      business_rules:
        - "员工身份用于用户权限控制，必须确保身份类型正确"

  # ---------------------------
  # 组织维度配置 - 组织架构层级定义
  # ---------------------------
  org_dimension_cf:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_dimension_code,      -- 维度代码
        org_dimension_name       -- 维度名称
      FROM org_dimension_cf
      WHERE org_dimension_code = 'SCM_ORG_GRP'  -- 业务条件: SCM组织组维度
        AND deleted = 0          -- 技术条件: 软删除过滤
        AND status = 'ENABLED'   -- 业务条件: 只查询启用状态
      LIMIT 2;                   -- 性能优化: 限制结果集（通常需要多个维度）

    description: "查询SCM组织组维度的配置信息，用于组织架构的分层管理"

    validation:
      required: false                   # 可选配置，组织架构时必需
      min_records: 0                    # 可为空
      max_records: 2                    # 最多2条记录
      required_fields: ["id", "org_dimension_code", "org_dimension_name"]
      business_rules:
        - "组织维度定义了组织架构的层级结构，必须与组织结构表配合使用"

  # ===========================================================================
  # 组织结构配置组 - 具体组织实体的配置数据
  # ===========================================================================

  # ---------------------------
  # 集团公司组织配置 - 根级组织实体
  # ---------------------------
  gr_come_org_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code = 'AUTOTEST_GR_ORG'     -- 业务条件: 自动化测试集团
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 只获取一条记录

    description: "查询自动化测试集团公司的组织信息，作为组织架构的根节点"

    validation:
      required: false                   # 可选配置，多组织架构时必需
      min_records: 0                    # 可为空
      max_records: 1                    # 最多1条记录（根组织唯一）
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "集团公司作为组织架构根节点，其他组织都从属与它"

  # ---------------------------
  # 公司组织配置 - 业务实体级组织
  # ---------------------------
  com_org_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code = 'AUTOTEST_COM_ORG'    -- 业务条件: 自动化测试公司
        AND org_business_type_codes = '["COM_ORG"]' -- 业务条件: 公司组织类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 只获取一条记录

    description: "查询自动化测试公司的组织信息，作为业务实体的主要组织单位"

    validation:
      required: false                   # 可选配置，公司业务时必需
      min_records: 0                    # 可为空
      max_records: 1                    # 最多1条记录（公司组织通常唯一）
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "公司组织是业务运营的主要实体，其他业务组织通常从属于公司组织"

  # ---------------------------
  # 采购组织配置 - 采购业务专用组织
  # ---------------------------
  pur_org_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code LIKE 'AUTOTEST%'        -- 业务条件: 自动化测试组织
        AND org_business_type_codes = '["PUR_ORG"]' -- 业务条件: 采购组织类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 获取第一个匹配的组织

    description: "查询采购业务的专用组织信息，用于采购订单和供应商管理的组织隔离"

    validation:
      required: false                   # 可选配置，采购业务时必需
      min_records: 1                    # 最少1条记录（采购业务必需）
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "采购组织用于采购业务的权限控制和数据隔离"
        - "必须确保采购组织状态为启用，否则采购流程无法正常执行"

  # ---------------------------
  # 库存组织配置 - 库存管理专用组织
  # ---------------------------
  inv_org_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code = 'AUTOTEST_INV_ORG'        -- 业务条件: 自动化测试组织
        AND org_business_type_codes = '["INV_ORG"]' -- 业务条件: 库存组织类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 获取第一个匹配的组织

    description: "查询库存管理的专用组织信息，用于库存控制和物料追踪的组织隔离"

    validation:
      required: false                   # 可选配置，库存管理时必需
      min_records: 1                    # 最少1条记录（库存业务必需）
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "库存组织用于库存业务的权限控制和数据隔离"
        - "库存组织状态必须为启用，否则库存操作无法执行"

  inv_org_info2:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code = 'AUTOTEST_INV_ORG2'        -- 业务条件: 自动化测试组织
        AND org_business_type_codes = '["INV_ORG"]' -- 业务条件: 库存组织类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 获取第一个匹配的组织

    description: "查询库存管理的专用组织信息，用于库存控制和物料追踪的组织隔离"

    validation:
      required: false                   # 可选配置，库存管理时必需
      min_records: 1                    # 最少1条记录（库存业务必需）
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "库存组织用于库存业务的权限控制和数据隔离"
        - "库存组织状态必须为启用，否则库存操作无法执行"


  # ---------------------------
  # 库存地点配置 - 库存物理位置组织
  # ---------------------------
  inv_loc_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code LIKE 'AUTOTEST%'        -- 业务条件: 自动化测试组织
        AND org_business_type_codes = '["INV_LOC"]' -- 业务条件: 库存地点类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 获取第一个匹配的地点

    description: "查询库存地点的组织信息，用于物理库存位置的管理和库存分配"

    validation:
      required: false                   # 可选配置，库存地点管理时必需
      min_records: 1                    # 最少1条记录（多地点库存管理时必需）
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "库存地点用于物理位置的库存管理，必须与仓库和仓位关联"
        - "库存地点状态必须为启用，否则无法进行库存操作"

  # ---------------------------
  # 销售组织配置 - 销售业务专用组织
  # ---------------------------
  sls_org_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code LIKE 'AUTOTEST%'        -- 业务条件: 自动化测试组织
        AND org_business_type_codes = '["SLS_ORG"]' -- 业务条件: 销售组织类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 获取第一个匹配的组织

    description: "查询销售业务的专用组织信息，用于销售订单和客户管理的组织隔离"

    validation:
      required: false                   # 可选配置，销售业务时必需
      min_records: 1                    # 最少1条记录（销售业务必需）
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]
      business_rules:
        - "销售组织用于销售业务的权限控制和数据隔离"
        - "销售组织状态必须为启用，否则销售流程无法正常执行"

  # ---------------------------
  # 计划组织配置 - 需求计划专用组织
  # ---------------------------
  pln_org_info:
    sql: |
      SELECT
        id,                      -- 主键ID
        org_code,                -- 组织代码
        org_name,                -- 组织名称
        org_status,              -- 组织状态
        org_dimension_code,      -- 组织维度代码
        org_business_type_code   -- 组织业务类型代码
      FROM org_struct_md
      WHERE org_status = 'ENABLED'           -- 业务条件: 只查询启用状态
        AND org_dimension_code = 'SCM_ORG_GRP' -- 业务条件: SCM组织组
        AND org_code LIKE 'AUTOTEST%'        -- 业务条件: 自动化测试组织
        AND org_business_type_codes = '["PLN_ORG"]' -- 业务条件: 计划组织类型
        AND deleted = 0                      -- 技术条件: 软删除过滤
      LIMIT 1;                               -- 性能优化: 获取第一个匹配的组织

    description: "查询需求计划的专用组织信息，用于物料需求计划和预测的组织隔离"

    validation:
      required: false                   # 可选配置，计划业务时必需
      min_records: 1                    # 最少1条记录（计划业务必需）
      max_records: 1                    # 最多1条记录
      required_fields: ["id"]
      business_rules:
        - "计划组织用于需求计划和预测的权限控制和数据隔离"
        - "计划组织通常与其他业务组织配合使用，实现端到端的计划流程"

  # ===========================================================================
  # 销售与渠道配置组 - 销售业务的基础配置数据
  # ===========================================================================

  # ---------------------------
  # 销售渠道配置 - 销售渠道定义
  # ---------------------------
  sls_dc_md:
    sql: |
      SELECT
        id,                      -- 主键ID
        `code`,                  -- 渠道代码
        `name`,                  -- 渠道名称
        is_online,               -- 是否线上渠道
        `status`                 -- 渠道状态
      FROM sls_dc_md
      WHERE code LIKE 'AUTOTEST_%'  -- 业务条件: 自动化测试渠道
        AND deleted = 0          -- 技术条件: 软删除过滤
        AND status = 'ENABLED'   -- 业务条件: 只查询启用状态
      ORDER BY id;               -- 排序: 确保结果稳定

    description: "查询自动化测试的销售渠道信息，用于销售订单的渠道分配和管理"

    validation:
      required: false                   # 可选配置，多渠道销售时必需
      min_records: 0                    # 可为空
      required_fields: ["id", "code", "name", "is_online", "status"]
      business_rules:
        - "销售渠道用于区分不同的销售方式和客户群体"
        - "渠道状态必须为启用，否则无法用于销售订单"

  # ===========================================================================
  # 库存与物流配置组 - 库存管理和物流的基础配置数据
  # ===========================================================================

  # ---------------------------
  # 仓库配置 - 库存存储基础设施
  # ---------------------------
  inv_wh_md:
    sql: |
      SELECT
        id,                      -- 主键ID
        `code`,                  -- 仓库代码
        `name`                   -- 仓库名称
      FROM inv_wh_md
      WHERE deleted = 0          -- 技术条件: 软删除过滤
        AND status = 'ENABLED'   -- 业务条件: 只查询启用状态
      LIMIT 1;                   -- 性能优化: 获取任意一个有效仓库

    description: "查询有效的仓库信息，用于库存管理和物料存储的基础配置"

    validation:
      required: false                   # 可选配置，库存管理时必需
      min_records: 0                    # 可为空
      max_records: 1                    # 最多1条记录
      required_fields: ["id", "code", "name"]
      business_rules:
        - "仓库是库存管理的基础设施，必须确保仓库状态为启用"

  # ---------------------------
  # 收货仓位配置 - 入库操作专用仓位
  # ---------------------------
  inv_bin_rec_md:
    sql: |
      SELECT
        inv_wh_id,               -- 仓库ID
        inv_area_id,             -- 仓储区ID
        id,                      -- 仓位ID
        `code`,                  -- 仓位代码
        `name`                   -- 仓位名称
      FROM inv_bin_md
      WHERE code = 'AUTOTEST_REC_BIN'  -- 业务条件: 自动化测试收货仓位
      LIMIT 1;                         -- 性能优化: 只获取一条记录

    description: "查询自动化测试收货仓位信息，包含仓库、仓储区和仓位三级结构"

    validation:
      required: false                   # 可选配置，收货业务时必需
      min_records: 0                    # 可为空
      max_records: 1                    # 最多1条记录
      required_fields: ["inv_wh_id", "inv_area_id", "id", "code", "name"]
      business_rules:
        - "收货仓位用于物料入库操作，必须与仓库和仓储区关联"
        - "仓位代码必须唯一，用于精确的库存定位"

  # ---------------------------
  # 发货仓位配置 - 出库操作专用仓位
  # ---------------------------
