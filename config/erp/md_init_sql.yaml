    # ---------------------------
    vend_template:
      sql: |
        SELECT
          id,                    -- 主键ID
          `name`,                -- 模板名称
          `desc`                 -- 模板描述
        FROM gen_dynamic_form_template_md
        WHERE name LIKE '%(自动化)%'  -- 业务条件: 自动化测试模板
          AND state = 'ENABLED'  -- 业务条件: 只查询启用状态
          AND template_type = 'gen_vend_dynamic_form_record_md'  -- 业务条件: 供应商表单类型
        LIMIT 1;                 -- 性能优化: 只获取一条记录

