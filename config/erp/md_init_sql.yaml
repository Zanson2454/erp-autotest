      validation:
        required: false                   # 可选配置，供应商扩展字段时必需
        min_records: 0                    # 可为空
        max_records: 1                    # 最多1条记录
        required_fields: ["id", "name", "desc"]
        business_rules:
          - "供应商动态表单模板用于扩展供应商主数据的字段"
          - "模板状态必须为启用，否则无法用于供应商数据录入"
          - "模板类型必须匹配供应商表单类型"

