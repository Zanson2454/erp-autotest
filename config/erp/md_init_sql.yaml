# MD配置数据查询定义
org_info:
  # 币种信息
  org_biz_type_cf:
    sql: |
     select id,`code`,`name` from org_business_type_cf where deleted=0
    description: "查询组织类型信息"

  # 组织属性
  org_attr_cf:  
    sql: |
      select attr_field, attr_code,attr_name from  gen_attr_cf where attr_class_code='ORG' and `status` = 'ENABLED' and deleted=0;
    description: "查询组织属性信息"

# 组织信息
  # 公司组织
  com_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status="ENABLED" AND org_dimension_code="SCM_ORG_GRP" AND org_code="AUTOTEST_COM_ORG" AND org_business_type_codes= '[\"COM_ORG\"]' LIMIT 1
    description: "查询公司组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 采购组织
  pur_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"PUR_ORG\"]' LIMIT 1
    description: "查询采购组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 库存组织
  inv_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"INV_ORG\"]' LIMIT 1
    description: "查询库存组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 库存地点
  inv_loc_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"INV_LOC\"]' LIMIT 1
    description: "查询库存地点信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]


  # 销售组织
  sls_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"SLS_ORG\"]' LIMIT 1
    description: "查询销售组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 计划组织
  pln_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"PLN_ORG\"]' LIMIT 1
    description: "查询计划组织信息"
    validation:
      min_records: 1
      required_fields: ["id"]

  # 销售渠道
  sls_dc_md:
    sql: |
      select id,`code`,`name`,is_online,`status`  from sls_dc_md where `code` like 'AT_%' and deleted=0 and `status`	='ENABLED'; 
    description: "查询销售渠道信息"

  # 仓库信息
  inv_wh_md:
    sql: |
      select id,`code`,`name` from inv_wh_md where deleted=0 and `status`="ENABLED" limit 1
    description: "查询仓库信息"

  # 默认员工
  employee_info:
    sql: |
      SELECT id, name
      FROM org_employee_md
      WHERE name='admin' LIMIT 1
    description: "查询默认员工信息"
    validation:
      min_records: 1
      required_fields: ["id", "name"]

mat_info:
  # 物料类目
  mat_cate_md:
    sql: |
      select id,`mat_cate_code`,`mat_cate_name` from gen_mat_cate_md where deleted=0 and `status`="ENABLED" and mat_cate_code like 'AUTOTEST_%'  limit 1
    description: "查询物料类目信息"
  # 物料品牌
  mat_brand_md:
    sql: |
      select id,`brand_code`,	`brand_name` from gen_brand_md where deleted=0 and brand_code like 'AUTOTEST_%'  limit 1
    description: "查询物料品牌信息"

  # 物料类型
  mat_type_cf:
    FINP:
      sql: |
        select id,	`mat_type_code`,`mat_type_name` from gen_mat_type_cf where deleted=0 and `mat_type_code`='FINP' limit 1;
      description: "查询成品物料类型信息"
    SERV:
      sql: |
        select id,	`mat_type_code`,`mat_type_name` from gen_mat_type_cf where deleted=0 and `mat_type_code`='SERV' limit 1;
      description: "查询服务物料类型信息"
    RAW:
      sql: |
        select id,	`mat_type_code`,`mat_type_name` from gen_mat_type_cf where deleted=0 and `mat_type_code`='RAW' limit 1;
      description: "查询原材料物料类型信息"

  # ATP检查组
  inv_atp_group_md:
    sql: |
      select id,`code`,`name` from inv_atp_group_md where deleted=0 limit 1
    description: "查询ATP检查组信息"

  # 标签
  gen_label_md:
    sql: |
      select id,`name`,usage_type from gen_label_md where usage_type='MAT'  and `name`='自动化' and `status`="ENABLED" limit 1
    description: "查询标签信息"
  
partner_info:
  # 供应商
  vend_info:
    sql: |
      SELECT id, `code`, `name`, `status`
      FROM gen_business_partner_md
      WHERE `status` = 'ENABLED' AND JSON_CONTAINS(partner_identity, '"SUPPLIER"') AND `code`='AUTOTEST_VEND' LIMIT 1
    description: "查询供应商信息"
    validation:
      min_records: 1
      required_fields: ["id", "code", "name", "status"]

  # 客户
  cust_info:
    sql: |
      SELECT id, `code`, `name`, `status`
      FROM gen_business_partner_md
      WHERE `status` = 'ENABLED' AND JSON_CONTAINS(partner_identity, '"CUSTOMER"') AND `code`='AUTOTEST_CUST' LIMIT 1
    description: "查询客户信息"
    validation:
      min_records: 1
      required_fields: ["id", "code", "name", "status"]
