# SCM配置数据查询定义
base_info:
  # 基础配置数据
  # 国家信息
  country_info:
    sql: |
      SELECT id as 'coun_id', coun_code, coun_name 
      FROM gen_coun_type_cf 
      WHERE coun_code='CHINA' AND deleted=0 LIMIT 1
    description: "查询中国的基础信息"
    validation:
      min_records: 1
      required_fields: ["coun_id", "coun_code", "coun_name"]

  # 币种信息
  currency_info:
    sql: |
      SELECT id as 'curr_id', curr_code, curr_name 
      FROM gen_curr_type_cf 
      WHERE curr_code='CNY' AND deleted=0 LIMIT 1
    description: "查询人民币的基础信息"
    validation:
      min_records: 1
      required_fields: ["curr_id", "curr_code", "curr_name"]

  # 语言信息
  language_info:
    sql: |
      SELECT id as 'language_id', language_code, language_name 
      FROM gen_language_type_cf 
      WHERE language_code='CHINESE' AND deleted=0 LIMIT 1
    description: "查询中文的基础信息"
    validation:
      min_records: 1
      required_fields: ["language_id", "language_code", "language_name"]

  # 时区信息
  timezone_info:
    sql: |
      SELECT id as 'timezone_id', timezone_code, timezone_desc 
      FROM gen_timezone_type_cf 
      WHERE status='INACTIVE' AND deleted=0 LIMIT 1
    description: "查询时区信息"
    validation:
      min_records: 1
      required_fields: ["timezone_id", "timezone_code", "timezone_desc"]

  # 汇率类型
  exchange_rate_type_info:
    sql: |
      SELECT id as 'exchange_rate_type_id', 
             type_code as 'exchange_rate_type_code', 
             type_name as 'exchange_rate_type_name' 
      FROM gen_curr_exchange_rate_type_cf 
      WHERE type_code='HR' AND deleted=0 LIMIT 1
    description: "查询汇率类型信息"
    validation:
      min_records: 1
      required_fields: ["exchange_rate_type_id", "exchange_rate_type_code", "exchange_rate_type_name"]

  # 税码信息
  tax_type_info:
    sql: |
      SELECT id as 'tax_type_id', tax_code, tax, taxcate 
      FROM gen_tax_type_cf 
      WHERE deleted=0
    description: "查询税码信息"
    validation:
      min_records: 0
      required_fields: ["tax_type_id", "tax_code", "tax", "taxcate"]

  # 物料税信息
  mat_tax_type_info:
    sql: |
      SELECT id as 'mat_tax_type_id', tax_class_code, tax_class_desc 
      FROM gen_mat_tax_type_cf 
      WHERE deleted=0
    description: "查询物料税信息"
    validation:
      min_records: 0
      required_fields: ["mat_tax_type_id", "tax_class_code", "tax_class_desc"]

  # 客户税信息
  cust_tax_type_info:
    sql: |
      SELECT id as 'cust_tax_type_id', tax_class_code, tax_class_desc 
      FROM gen_cust_tax_type_cf 
      WHERE deleted=0
    description: "查询客户税信息"
    validation:
      min_records: 0
      required_fields: ["cust_tax_type_id", "tax_class_code", "tax_class_desc"]

  # 国家税信息
  coun_tax_type_info:
    sql: |
      SELECT id as 'coun_tax_type_id', tax_type_code, tax_type_name 
      FROM gen_coun_tax_type_cf 
      WHERE deleted=0
    description: "查询国家税信息"
    validation:
      min_records: 0
      required_fields: ["coun_tax_type_id", "tax_type_code", "tax_type_name"]

  # 计量单位信息
  uom_info:
    sql: |
      SELECT id as 'uom_id', uom_code, uom_type, uom_desc 
      FROM gen_uom_type_cf 
      WHERE deleted=0
    description: "查询计量单位信息"
    validation:
      min_records: 0
      required_fields: ["uom_id", "uom_code", "uom_type", "uom_desc"]

  # 银行信息
  bank_info:
    sql: |
      SELECT id as 'bank_id', bank_code, bank_name, bank_mne_code 
      FROM gen_bank_cf 
      WHERE deleted=0 LIMIT 1
    description: "查询银行信息"
    validation:
      min_records: 1
      required_fields: ["bank_id", "bank_code", "bank_name", "bank_mne_code"]

  # 工作日历信息
  work_calendar_info:
    sql: |
      SELECT id as 'wc_id', wc_head_code, wc_head_name, enable_status 
      FROM gen_wc_head_cf 
      WHERE enable_status="ENABLED" 
      AND JSON_CONTAINS(default_rest_date, '["SATURDAY","SUNDAY"]') 
      AND deleted=0
    description: "查询工作日历信息"
    validation:
      min_records: 1
      required_fields: ["wc_id", "wc_head_code", "wc_head_name", "enable_status"]

  # 会计期间信息
  calendar_info:
    sql: |
      SELECT id as 'calendar_id', calendar_code, calendar_name, `status` 
      FROM gen_calendar_head_cf 
      WHERE calendar_name LIKE "%%标准会计期间%%" 
      AND deleted=0 
      AND `status`="ENABLED"
    description: "查询会计期间信息"
    validation:
      min_records: 1
      required_fields: ["calendar_id", "calendar_code", "calendar_name", "status"]

  # 组织信息
  # 集团组织
  group_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_code = "AUTOTEST_GR_ORG" AND org_dimension_code='SCM_ORG_GRP' AND org_status="ENABLED" AND deleted=0
      LIMIT 1
    description: "查询集团组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 行政组织-主组织
  adm_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_codes
      FROM org_struct_md
      WHERE org_status="ENABLED" AND org_dimension_code="ADM_ORG_GRP" AND org_code = "AUTOTEST_ADM_ORG" AND org_business_type_codes='[\"ADM_ORG\"]' LIMIT 1
    description: "查询行政组织-主组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_codes"]

  # 公司组织
  com_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status="ENABLED" AND org_dimension_code="SCM_ORG_GRP" AND org_code="AUTOTEST_COM_ORG" AND org_business_type_codes= '[\"COM_ORG\"]' LIMIT 1
    description: "查询公司组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 采购组织
  pur_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"PUR_ORG\"]' LIMIT 1
    description: "查询采购组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 库存组织
  inv_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"INV_ORG\"]' LIMIT 1
    description: "查询库存组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 销售组织
  sls_org_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_codes = '[\"SLS_ORG\"]' LIMIT 1
    description: "查询销售组织信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 行政组织-部门组织
  dept_org_info:
    sql: |
      SELECT id
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='ADM_ORG_GRP' AND org_code = 'AUTOTEST_DP_ORG' AND org_business_type_code='ADM_ORG' LIMIT 1
    description: "查询行政组织-部门组织信息"
    validation:
      min_records: 1
      required_fields: ["id"]

  # 计划组织
  pln_org_info:
    sql: |
      SELECT id
      FROM org_struct_md
      WHERE org_business_type_code='PLN_ORG' AND org_name LIKE '%自动化%'
    description: "查询计划组织信息"
    validation:
      min_records: 1
      required_fields: ["id"]

  # 默认员工
  employee_info:
    sql: |
      SELECT id, name
      FROM org_employee_md
      WHERE name='admin' LIMIT 1
    description: "查询默认员工信息"
    validation:
      min_records: 1
      required_fields: ["id", "name"]

  # 销售渠道
  sales_channel_info:
    sql: |
      SELECT a.id, a.`code`, a.`name`
      FROM org_sls_dc_cf a
      JOIN org_struct_md b ON JSON_CONTAINS(b.def13, CAST(a.id AS JSON), '$')
      WHERE a.deleted = 0 LIMIT 1
    description: "查询销售渠道信息"
    validation:
      min_records: 1
      required_fields: ["id", "code", "name"]

  # 库存地点
  inv_loc_info:
    sql: |
      SELECT id, org_code, org_name, org_status, org_dimension_code, org_business_type_code
      FROM org_struct_md
      WHERE org_status='ENABLED' AND org_dimension_code='SCM_ORG_GRP' AND org_code LIKE 'AUTOTEST%' AND org_business_type_code='INV_LOC' LIMIT 1
    description: "查询库存地点信息"
    validation:
      min_records: 1
      required_fields: ["id", "org_code", "org_name", "org_status", "org_dimension_code", "org_business_type_code"]

  # 合作伙伴
  # 供应商
  vend_info:
    sql: |
      SELECT id, `code`, `name`, `status`
      FROM gen_business_partner_md
      WHERE `status` = 'ENABLED' AND JSON_CONTAINS(partner_identity, '"SUPPLIER"') AND `code`='AUTOTEST_VEND' LIMIT 1
    description: "查询供应商信息"
    validation:
      min_records: 1
      required_fields: ["id", "code", "name", "status"]

  # 客户
  cust_info:
    sql: |
      SELECT id, `code`, `name`, `status`
      FROM gen_business_partner_md
      WHERE `status` = 'ENABLED' AND JSON_CONTAINS(partner_identity, '"CUSTOMER"') AND `code`='AUTOTEST_CUST' LIMIT 1
    description: "查询客户信息"
    validation:
      min_records: 1
      required_fields: ["id", "code", "name", "status"]

  # 物料相关
  # ATP检查组
  atp_group_info:
    sql: |
      SELECT id 
      FROM gen_atp_group_md 
      WHERE code='ATP001' AND deleted=0 LIMIT 1
    description: "查询默认ATP检查组信息"
    validation:
      min_records: 1
      required_fields: ["id"]

  # 库存类型
  inv_type_info:
    sql: |
      SELECT id, name, code 
      FROM inv_inv_type_cf 
      WHERE deleted=0 LIMIT 1
    description: "查询库存类型信息"
    validation:
      min_records: 1
      required_fields: ["id", "name", "code"]

  # 销售订单类型
  so_type_info:
    sql: |
      SELECT id, so_type_code, so_type_name 
      FROM sls_so_type_cf 
      WHERE deleted=0 AND so_type_code='STND'
    description: "查询销售订单类型信息"
    validation:
      min_records: 1
      required_fields: ["id", "so_type_code", "so_type_name"] 