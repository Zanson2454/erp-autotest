# 数据清理配置
# 按模块组织清理脚本，支持事务和错误处理

modules:
  # 销售模块
  sales:
    description: "销售模块数据清理"
    tables:
      - name: "sales_orders"
        sql: "DELETE FROM sales_orders WHERE order_no IN (%(order_nos)s)"
        params:
          order_nos: "{{ order_nos }}"
        dependencies: ["sales_order_items"]
        
      - name: "sales_order_items"
        sql: "DELETE FROM sales_order_items WHERE order_no IN (%(order_nos)s)"
        params:
          order_nos: "{{ order_nos }}"
        dependencies: []

  # 采购模块
  purchase:
    description: "采购模块数据清理"
    tables:
      - name: "purchase_orders"
        sql: "DELETE FROM purchase_orders WHERE po_no IN (%(po_nos)s)"
        params:
          po_nos: "{{ po_nos }}"
        dependencies: ["purchase_order_items"]
        
      - name: "purchase_order_items"
        sql: "DELETE FROM purchase_order_items WHERE po_no IN (%(po_nos)s)"
        params:
          po_nos: "{{ po_nos }}"
        dependencies: []

  # 库存模块
  inventory:
    description: "库存模块数据清理"
    tables:
      - name: "inventory_transactions"
        sql: "DELETE FROM inventory_transactions WHERE transaction_no IN (%(transaction_nos)s)"
        params:
          transaction_nos: "{{ transaction_nos }}"
        dependencies: []

# 全局配置
config:
  transaction: true  # 是否使用事务
  error_handling: "rollback"  # 错误处理方式：rollback, continue, stop
  logging: true  # 是否记录清理日志
  dry_run: false  # 是否只显示SQL不执行 