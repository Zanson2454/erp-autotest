# SLS配置数据查询定义
base_info:
  # 订单类型信息
  ORDER_TYPES:
    sql: |
      SELECT id, name FROM sls_so_type_cf WHERE deleted = 0
    description: "查询订单类型"
    validation:
      min_records: 1
      required_fields: ["id", "so_type_name", "so_type_code"]

  # 订单行类型信息
  ORDER_LINE_TYPES:
    sql: |
      SELECT id, name FROM sls_so_item_type_cf WHERE deleted = 0
    description: "查询订单行类型"
    validation:
      min_records: 1
      required_fields: ["id", "so_item_type_name", "so_item_type_code"]

  # 订单类型和订单行类型分配    
  ORDER_TYPE_LINE_COMBINATIONS:
    sql: |
      SELECT so_type_id, so_item_type_id FROM ssls_so_item_detm_cf WHERE deleted = 0
    description: "查询订单类型和订单行类型的分配"
    validation:
      min_records: 1
      required_fields: ["so_type_id", "so_item_type_id"]    
