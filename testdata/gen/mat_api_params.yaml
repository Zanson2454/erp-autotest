# 物料API接口通用参数
api_params:
  # 物料主数据默认页面
  "/api/trantor/service/engine/execute/ERP_GEN$gen_mat_md_PAGING_DATA_SERVICE?tmodule=ERP_SCM":
    params:
      request:
        pageable:
          pageNo: 1
          pageSize: 20
          keyword: ""
          conditionGroup: null
          sortOrders:
            - fieldAlias: "updatedAt"
              id: "updatedAt-0"
              sortType: "DESC"
        cateId: null

  # 新增物料
  "/api/trantor/service/engine/execute/ERP_GEN$GEN_MD_MAT_CLEAR_CACHE_BY_IDS_EVENT_SERVICE?tmodule=ERP_SCM":
    params:
      request:
        matCode: ${mat_code}  # 动态替换的物料编码
        matName: ${mat_name}  # 动态替换的物料名称
        status: "INACTIVE"  # 初始状态：未启用
        bizStatus: "SALE"  # 业务状态：销售
        baseUomId: 2004001  # 基本单位：件
        genMatTypeCfId: 2000001  # 物料类型：成品
        remark: ${remark}  # 动态替换的备注

  # 启用物料
  "/api/trantor/service/engine/execute/ERP_GEN$GEN_MAT_ENABLED_CLEAR_CACHE_EVENT_SERVICE?tmodule=ERP_SCM":
    params:
      request:
        id: ${mat_id}  # 动态替换的物料ID
        matCode: ${mat_code}  # 动态替换的物料编码
        status: "ACTIVE"  # 启用状态

  # 停用物料
  "/api/trantor/service/engine/execute/ERP_GEN$GEN_MAT_DISSBLED_CLEAR_CACHE_EVENT_SERVICE?tmodule=ERP_SCM":
    params:
      request:
        id: ${mat_id}  # 动态替换的物料ID
        matCode: ${mat_code}  # 动态替换的物料编码
        status: "ENABLED"  # 停用状态
  # 新增供应商合作伙伴
  "/api/trantor/service/engine/execute/ERP_GEN$GEN_COM_PARTNER_SAVE_EVENT_SERVICE?tmodule=ERP_GEN":
    params:
      request:
        partnerIdentity:
          - SUPPLIER
        partnerTypeId:
          id: 2011001
        classType: COMPANY
        code: ${partner_code}
        name: ${partner_name}
        isInternal: true
        comId: null
        personId: null
        status: INACTIVE
        id: null
        createdBy: null
        updatedBy: null
        createdAt: null
        updatedAt: null
        version: 0
        deleted: 0
        markupRate: null
        outCode: WBBM
        addrLink:
          - isDefault: true
            addrUsage: DEL_ADDR
            addrId:
              id: 70035293
            addrDetail: 合作伙伴发货详细地址
            contactName: 发货联系人
            contactPhone: '13732324455'
          - isDefault: true
            addrUsage: REC_ADDR
            addrId:
              id: 70029245
            addrDetail: 合作伙伴收货详细地址
            contactName: 收货联系人
            contactPhone: '13732324466'
        bankLink: null
        textLink: null
        attachmentLink: null
        genVendEmployeeList: []
        vendUserLink: []
        vendPersonList:
          - main: true
            personName: 合作伙伴联系人
            workPhone: '13732327788'
        vendFinList: null
        vendPurList: null
        vendCateList: null
        vendQualificationsLink: null
        vendPartnerLink: null
        comCorporation: SQW
        bizLicenseNo: '123456'
        enterpriseType: VENDOR
        registeredCapital: '1000'
        socialCreditCode: '123456'
        counId:
          id: 14037001
        taxpayersNum: '123456'
        addressId:
          id: 70035560
        addressDetail: 注册详细地址
        bizScope: 经营范围
        intro: 简介

  # 查询合作伙伴
  "/api/trantor/service/engine/execute/ERP_GEN$GEN_BUSINESS_PARTNER_MD_PAGING_DATA_SERVICE?tmodule=ERP_GEN":
    params:
      request:
        pageable:
          pageNo: 1
          pageSize: 20
          conditionItems:
            type: ConditionItems
            conditions:
              code:
                operator: CONTAINS
                value: ${partner_code}
            logicOperator: AND

  # 启用合作伙伴
  "/api/trantor/service/engine/execute/ERP_GEN$PARTNER_ENABLED_EVENT_SERVICE?tmodule=ERP_GEN":
    params:
      request:
        status: INACTIVE
        id: ${partner_id}

  # 停用合作伙伴
  "/api/trantor/service/engine/execute/ERP_GEN$PARTNER_DISABLED_EVENT_SERVICE?tmodule=ERP_GEN":
    params:
      request:
        status: ENABLED
        id: ${partner_id}

  # 删除合作伙伴
  "/api/trantor/service/engine/execute/ERP_GEN$GEN_COM_PARTNER_DELETE_EVENT_SERVICE?tmodule=ERP_GEN":
    params:
      request:
        id: ${partner_id}  # 动态替换的合作伙伴ID
        deleted: 1
        version: 0
