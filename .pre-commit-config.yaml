repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-project-structure
        name: validate-project-structure
        entry: python3 script/validate_project_structure.py
        language: system
        pass_filenames: false
      - id: quality-guard
        name: quality-guard
        entry: python script/quality_guard.py
        language: system
        pass_filenames: true
        types_or: [python, yaml, toml, markdown]
