[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
  ".git",
  ".venv",
  ".pytest_cache",
  "reports",
  "logs",
  "outputs",
  "static",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
