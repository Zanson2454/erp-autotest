[pytest]
addopts = 
    -v 
    --tb=short
    --alluredir=reports/allure-results
    -p no:randomly
    # 并行执行需要 pytest-xdist；若本机未安装会报 “unrecognized arguments: -n/--dist”
    # 建议在命令行显式开启：pytest -n auto --dist loadscope
    
testpaths = testcases tests
markers = 
     smoke: 冒烟测试
     regression: 回归测试
     api: API测试
     p0: 最高优先级测试用例
     p1: 高优先级测试用例
     dev: 开发环境测试用例
     uat: UAT环境测试用例
     run: 标记测试用例的执行顺序
     order: 标记测试用例的执行顺序
     serial_flow: 关键业务流串行执行分组（建议独立CI作业 -n 1）
     unit: 单元测试分组（默认建议独立作业执行）
# Ignore warnings
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnknownMarkWarning
    ignore::pytest.PytestCollectionWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Test file naming patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Environment variables
env =
    PYTHONPATH=.
