[pytest]
addopts = 
    -v 
    --tb=short
    
testpaths = testcases
markers = 
    smoke: 冒烟测试
    regression: 回归测试
    api: API测试
    p0: 最高优先级测试用例
    p1: 高优先级测试用例
    dev: 开发环境测试用例
    uat: UAT环境测试用例 
    run: 标记测试用例的执行顺序
    smoke: 标记冒烟测试用例
    regression: 标记回归测试用例
    order: 标记测试用例的执行顺序


## 忽略的警告
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning

# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

#配置了testpaths、addopts、python_files之后，只需要在控制台输入pytest，就会自动执行testpaths目录下的所有测试用例