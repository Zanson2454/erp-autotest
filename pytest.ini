[pytest]
addopts = 
    -v 
    --tb=short
    
testpaths = testcases
markers = 
    smoke: 冒烟测试
    regression: 回归测试
    api: API测试
    p0: 最高优先级测试用例
    p1: 高优先级测试用例
    dev: 开发环境测试用例
    uat: UAT环境测试用例 

## 忽略的警告
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning

# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*