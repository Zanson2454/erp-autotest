<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="/static/swagger-ui-5.22.0/swagger-ui.css" />
    <link rel="icon" type="image/png" href="/static/swagger-ui-5.22.0/favicon-32x32.png" />
    <title>Swagger UI</title>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/static/swagger-ui-5.22.0/swagger-ui-bundle.js"></script>
    <script src="/static/swagger-ui-5.22.0/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function() {
        window.ui = SwaggerUIBundle({
          url: "/openapi.json",
          dom_id: '#swagger-ui',
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          layout: "StandaloneLayout"
        });
      }
    </script>
  </body>
</html>
