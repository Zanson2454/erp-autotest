version: "2.0"
services:
  erp-autotest:   # 服务名称，与pipeline.yml中的release阶段对应
    ports:
      - port: 8000
        expose: true
    deployments:
      replicas: 1   # 部署副本数：1个实例
    health_check:
      http:
        # port 配置健康检查 http get 请求的端口，此端口应该是 ports 配置中的一个
        port: 8000
        # path 配置健康检查 http get 的 URI 路径
        path: /
        # duration 设定健康检查需要持续的检查的时间，单位是秒；这个时间值应该设置为比服务启动需要的时间更长一点
        duration: 600
    resources:
      cpu: 1
      mem: 1024
envs: {}